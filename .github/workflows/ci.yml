name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile   # commit pnpm-lock.yaml first
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Arena suite
        if: ${{ hashFiles('arena/runner.ts') != '' }}
        run: pnpm arena:run

  ml:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/ml/requirements.txt
      - run: pip install -r requirements.txt
      - name: Tests (exit code 5 means no tests yet)
        run: pytest -q || [ $? -eq 5 ]
