# Render Blueprint (SKETCH, VERIFY field names and plans against current Render docs).
# Create the Workflows service in the Render dashboard; it is not defined here.
# Free web services spin down when idle: use a paid plan for api and vendors during demo week.
# Free Postgres expires: check the current limit before Nov 12 and upgrade if needed.

databases:
  - name: rm-db
    databaseName: rm
    plan: free

envVarGroups:
  - name: rm-shared
    envVars:
      - key: PAYPAL_ENV
        value: sandbox
      - key: SERVICE_TOKEN
        sync: false
      - key: NODE_VERSION
        value: 20

services:
  - type: web
    name: rm-api
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    startCommand: pnpm --filter @rm/api start
    healthCheckPath: /health
    envVars:
      - fromGroup: rm-shared
      - key: DATABASE_URL
        fromDatabase:
          name: rm-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        sync: false
      - key: VENDOR_A_URL
        sync: false
      - key: VENDOR_B_URL
        sync: false
      - key: ML_SERVICE_URL
        sync: false
      - key: PAYPAL_COMPANY_CLIENT_ID
        sync: false
      - key: PAYPAL_COMPANY_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: WEBAUTHN_RP_ID
        sync: false
      - key: WEBAUTHN_ORIGIN
        sync: false
      - key: ARENA_ENABLED
        value: 'true'

  - type: web
    name: rm-vendor-a
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    startCommand: pnpm --filter @rm/vendor-a start
    healthCheckPath: /vendor/v1/health
    envVars:
      - fromGroup: rm-shared
      - key: DATABASE_URL
        fromDatabase:
          name: rm-db
          property: connectionString
      - key: PAYPAL_VENDOR_A_CLIENT_ID
        sync: false
      - key: PAYPAL_VENDOR_A_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false

  - type: web
    name: rm-vendor-b
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    startCommand: pnpm --filter @rm/vendor-b start
    healthCheckPath: /vendor/v1/health
    envVars:
      - fromGroup: rm-shared
      - key: DATABASE_URL
        fromDatabase:
          name: rm-db
          property: connectionString
      - key: PAYPAL_VENDOR_B_CLIENT_ID
        sync: false
      - key: PAYPAL_VENDOR_B_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false

  - type: web
    name: rm-ml
    runtime: python
    plan: free
    rootDir: apps/ml
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: SERVICE_TOKEN
        sync: false

  - type: web
    name: rm-web
    runtime: static
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @rm/web build
    staticPublishPath: apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_AG_GRID_LICENSE
        sync: false

  - type: cron
    name: rm-run-trigger
    runtime: node
    plan: starter
    schedule: '0 7 * * 1-5'
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    startCommand: pnpm --filter @rm/workflows trigger
    envVars:
      - fromGroup: rm-shared
      - key: API_URL
        sync: false
      - key: RENDER_API_KEY
        sync: false
